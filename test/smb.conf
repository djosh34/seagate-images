# Test config for CI. The real one lives in djosh34/talos_home_assistent.
[global]
  server role = standalone server
  security = user
  map to guest = never
  server min protocol = SMB2_10
  smb ports = 445
  disable netbios = yes
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  logging = stdout
  private dir = /state
  lock directory = /state
  state directory = /state
  cache directory = /state
  pid directory = /state
  ncalrpc dir = /state/ncalrpc
  passdb backend = smbpasswd:/state/smbpasswd
  vfs objects = catia fruit streams_xattr
  fruit:metadata = stream
  fruit:resource = file

[timemachine]
  path = /timemachine
  valid users = tm
  force user = smb
  read only = no
  fruit:time machine = yes

[data]
  path = /data
  valid users = rw
  force user = smb
  read only = no
